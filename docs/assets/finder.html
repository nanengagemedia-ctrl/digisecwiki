<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Security Tool Finder</title>
<style>
:root{
  --bg:#f6f7f8; --panel:#ffffff; --text:#1a1d21; --muted:#5b6470; --accent:#2f6f4f;
  --accent2:#1d4d36; --border:#dfe3e6; --danger:#8a3b2b; --danger-bg:#fbeee9; --chip:#eef2ef;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151a; --panel:#1b1f26; --text:#e9edf1; --muted:#98a2ad; --accent:#5fbf8f;
    --accent2:#7fd6a8; --border:#2b313a; --danger:#e39683; --danger-bg:#2c1c17; --chip:#232830;
  }
}
:root[data-theme="dark"]{
  --bg:#12151a; --panel:#1b1f26; --text:#e9edf1; --muted:#98a2ad; --accent:#5fbf8f;
  --accent2:#7fd6a8; --border:#2b313a; --danger:#e39683; --danger-bg:#2c1c17; --chip:#232830;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.45;}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px;}
header{margin-bottom:18px;}
h1{font-size:1.5rem;margin:0 0 4px;}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 14px;}
.privacy{font-size:.8rem;color:var(--muted);background:var(--chip);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:18px;}
.crumbs{font-size:.78rem;color:var(--muted);margin-bottom:10px;min-height:1em;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
.q{font-size:1.05rem;font-weight:600;margin:0 0 14px;}
.opt{display:block;width:100%;text-align:left;background:var(--chip);border:1px solid var(--border);color:var(--text);
  padding:12px 14px;border-radius:10px;margin-bottom:8px;font-size:.95rem;cursor:pointer;}
.opt:hover{border-color:var(--accent);}
.opt small{display:block;color:var(--muted);font-weight:400;margin-top:2px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:.85rem;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.tool{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--panel);}
.tool h3{margin:0 0 4px;font-size:1rem;}
.tool a{color:var(--accent2);font-size:.82rem;text-decoration:none;}
.tool p{margin:6px 0 8px;font-size:.9rem;color:var(--text);}
.tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:.7rem;background:var(--chip);color:var(--muted);border-radius:20px;padding:3px 9px;}
.caution{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger);border-radius:10px;padding:12px 14px;font-size:.85rem;margin-bottom:14px;}
.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 0 8px;}
footer{margin-top:30px;font-size:.75rem;color:var(--muted);text-align:center;}
.result-empty{color:var(--muted);font-size:.9rem;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>

// ---------------------------------------------------------------
// QUESTION GRAPH
// ---------------------------------------------------------------
const PLATFORM_Q = {id:'platform', text:"What device will you mainly use?",
  opts:[['Android phone','android'],['iPhone','ios'],['Windows PC','windows'],['Mac','mac'],['Linux PC','linux']]};

const NODES = {
  start:{text:"What's going on?", opts:[
    {label:"I need to set up safe communications", next:'comms_adv'},
    {label:"I need a tool for a specific task", next:'task_type'},
    {label:"I don't feel safe and think I'm being watched or targeted", next:'unsafe_concern'},
    {label:"Walk me through a general security check-up", next:'RESULT_CHECKUP'},
    {label:"Just show me everything", next:'RESULT_ALL'},
  ]},
  comms_adv:{text:"How serious is the risk if this communication were exposed?", opts:[

  comms_net:{text:"What's the network situation where you'll use this?", opts:[

const TOOL_COMPARE_URL = 'https://claude.ai/artifact/VG8PfVEQrVnm1PC7KxWLuF';

function renderCheckup(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header>
      <h1>🛡️ Digital Security Tool Finder</h1>
      <p class="sub">General security check-up</p>
      <div class="privacy">This walks the same topics as <a href="https://securityinabox.org/en" target="_blank" rel="noopener" style="color:var(--accent2)">Security in a Box</a> (Front Line Defenders) — we link to their guidance rather than duplicate it, and map each topic to FOSS tools where one fits. Items marked "no FOSS tool cataloged yet" are real gaps, not oversights.</div>
    </header>
    ${CHECKUP.map(sec=>`
      <div class="section-title">${sec.cat}</div>
      ${sec.items.map(it=>`

          </div>
        </div>`).join('')}
    `).join('')}
    <p style="font-size:.8rem;color:var(--muted);">Full comparison of the tools above (encryption model, audits, jurisdiction, cost): <a href="${TOOL_COMPARE_URL}" target="_blank" rel="noopener" style="color:var(--accent2)">Tool comparison table →</a></p>
    <div class="row" style="margin-top:10px;"><button class="btn ghost" onclick="reset()">Start over</button></div>
    <footer>Nothing you enter here is saved, logged, or sent anywhere.</footer>
  `;
}

// ---------------------------------------------------------------

// branch. This exists because generic tag-matched tool cards are the
// wrong output here: someone whose device was just searched needs an
// ordered action list, not a password manager. Only steps with a real
// FOSS fit reference a tool; everything else says so plainly and
// links to Security in a Box instead of guessing.
// ---------------------------------------------------------------
const CONCERN_GUIDES = {

 'concern-malware':{title:"Possible malware — no vetted FOSS scanner in this database yet",

   {t:"Remote-lock or remote-wipe it now, if you still can",d:"__PLATFORM__"},

   {t:"For next time",d:"A device that boots into an amnesiac OS, or a hardened OS with no account tied to it, limits what a future search can expose.",tools:['Tails OS','GrapheneOS']},

   {t:"Lock down account privacy settings",d:"Limit who can see your posts, followers list, and contact info."},
   {t:"Report and block through the platform",d:"Most platforms have a harassment/doxxing-specific report flow that moves faster than a general report."},
   {t:"Tighten account security as a precaution",d:"Doxxing often follows — or is followed by attempts at — account compromise.",tools:['Bitwarden','Aegis Authenticator']},
  ], link:{u:'https://securityinabox.org/en/communication/social-media',label:'Security in a Box: protect yourself on social media'}},
 'concern-general':{title:"No specific incident — a baseline check-up",
  steps:[
   {t:"Unique passwords everywhere",d:"A password manager makes this painless.",tools:['KeePassXC','Bitwarden']},
   {t:"2FA on your important accounts",d:"Start with email and anything that can reset other accounts.",tools:['Aegis Authenticator']},
   {t:"Check who has access",d:"Review connected apps and active sessions on your main accounts."},
   {t:"Keep devices updated",d:"Most real-world compromises exploit already-patched vulnerabilities."},
  ], link:{u:'https://securityinabox.org/en',label:'Or walk the full Security in a Box check-up'}},
};

function toolLink(name){
  const t = TOOLS.find(x=>x.name===name);
  return t ? `<a href="${t.url}" target="_blank" rel="noopener" class="tag" style="text-decoration:none;">${name} →</a>` : `<span class="tag">${name}</span>`;
}

// ---------------------------------------------------------------
// TASK GUIDES — one prioritized, plain-language answer per task,
// instead of a scored list (which is how Tor Browser used to show
// up for "back up my files": it matched on the broad goal-task tag
// alone). Each task now points at exactly the tool(s) that apply.
// ---------------------------------------------------------------
const TASK_GUIDES = {
 'task-encrypt-files':{title:"Keep files unreadable to anyone who gets hold of them", primary:'veracrypt', alt:['cryptomator'],
  step:"Files that live on a local drive → VeraCrypt. Files you sync to Dropbox/Drive/etc → Cryptomator.",
  learn:'https://securityinabox.org/en/files/secure-file-storage'},
 'task-passwords':{title:"Stop reusing passwords and limit the damage from any one leak", primary:'bitwarden', alt:['keepassxc'],
  step:"Bitwarden syncs itself across devices; KeePassXC keeps the database local only. Either way, also turn on 2FA — Aegis Authenticator generates codes without relying on text messages.",
  learn:'https://securityinabox.org/en/passwords/password-managers'},
 'task-browse-anon':{title:"Browse without sites, your ISP, or a censor seeing what you're doing", primary:'tor', alt:[],
  step:"Install it and browse — no extra setup needed for basic anonymous browsing.",
  learn:'https://securityinabox.org/en/internet-connection/safer-browsing'},
 'task-metadata':{title:"Remove hidden info from a file before you share it", primary:'mat2', alt:[],
  step:"Run it on the file before you upload or send it, not after.",
  learn:'https://securityinabox.org/en/files/destroy-identifying-information'},
 'task-whole-device':{title:"Lock down an entire device, not just one app", primary:'tails', alt:['graphene'],
  step:"Tails is for one sensitive session on any computer, then gone. GrapheneOS replaces the OS on a phone you use every day — Google Pixel only.",
  learn:'https://securityinabox.org/en/phones-and-computers/malware'},
 'task-backups':{title:"Back up your files without handing an unencrypted copy to a cloud provider", primary:'restic', alt:[],
  step:"It's command-line only — a simpler point-and-click option is a gap in this database right now.",
  learn:'https://securityinabox.org/en/files/backup'},
 'task-email':{title:"Make your email unreadable to anyone except the recipient", primary:'thunderbird', alt:[],
  step:"Both you and the person you're emailing need this set up — it doesn't work one-sided.",
  learn:'https://securityinabox.org/en/communication/secure-email'},
 'task-share-files':{title:"Send a file to one person without a company's server seeing it", primary:'onionshare', alt:[],
  step:"The other person needs Tor Browser installed to receive it.",
  learn:'https://securityinabox.org/en/files/secure-file-storage'},
};

// ---------------------------------------------------------------
// COMMS GUIDE — a small decision table instead of scoring, so the
// adversary level and network condition actually narrow the pick
// rather than every goal-comms tool showing up regardless.
// ---------------------------------------------------------------
function commsGuide(adv, net){
  if(net==='net-offline') return {title:"Something that works without relying on the internet", primary:'briar', alt:['simplex'],
    step:"Pair Briar with your contact in person (or by QR) ahead of time — that one-time pairing is what lets it work offline later.",
    learn:'https://securityinabox.org/en/assess-plan/private-communication'};
  if(net==='net-censored'){
    if(adv==='adv-high') return {title:"High-risk communication where the network itself is watched or blocked", primary:'briar', alt:['simplex'],
      step:"Briar can route over Tor automatically. If you also need to reach Signal or SimpleX, pair either with Tor Browser.",
      learn:'https://securityinabox.org/en/internet-connection/circumvention'};
    return {title:"Everyday-risk messaging on a censored or monitored network", primary:'signal', alt:['simplex'],
      step:"You may need Tor Browser or a VPN just to reach Signal's servers if they're blocked where you are.",
      learn:'https://securityinabox.org/en/internet-connection/circumvention'};
  }
  if(adv==='adv-high') return {title:"High-risk communication over a normal internet connection", primary:'simplex', alt:['briar'],
    step:"SimpleX needs no phone number or ID — set it up ahead of time and verify your contact's connection code out-of-band.",
    learn:'https://securityinabox.org/en/communication/secure-chat'};
  if(adv==='adv-medium') return {title:"Communication that could cause real harm if exposed", primary:'signal', alt:['simplex'],
    step:"Install Signal and verify your contact's safety number in person or over a different channel.",
    learn:'https://securityinabox.org/en/communication/secure-chat'};
  return {title:"Everyday private messaging", primary:'signal', alt:['jitsi'],
    step:"Signal is the easiest starting point — most contacts can probably already use it.",
    learn:'https://securityinabox.org/en/communication/secure-chat'};
}

function toolCardHtml(id, badge){
  const t = TOOLS.find(x=>x.id===id);
  if(!t) return '';
  const pill = badge ? `<span class="tag" style="background:var(--accent);color:#fff;margin-right:6px;">${badge}</span>` : '';
  return `<div class="tool">
    <h3>${pill}${t.name}</h3>
    <p>${t.why}</p>
    <a href="${t.url}" target="_blank" rel="noopener">${t.url.replace('https://','')} →</a>
  </div>`;
}

function renderPriorityGuide(sub, primaryId, altIds, step, learnUrl){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header><h1>🛡️ Digital Security Tool Finder</h1><p class="sub">${sub}</p></header>
    <div class="crumbs">${trail.map(t=>t.label).join(' → ')}</div>
    ${toolCardHtml(primaryId,'Best fit')}
    ${altIds.map(id=>toolCardHtml(id,'Also works')).join('')}
    <p class="line" style="font-size:.85rem;"><b>Next step:</b> ${step}</p>
    <p style="font-size:.8rem;color:var(--muted);margin-top:10px;">
      ${learnUrl ? `Want to understand why this works, in plain terms? <a href="${learnUrl}" target="_blank" rel="noopener" style="color:var(--accent2)">Security in a Box explains it →</a><br>` : ''}
      Full technical comparison (encryption, audits, jurisdiction): <a href="${TOOL_COMPARE_URL}" target="_blank" rel="noopener" style="color:var(--accent2)">Tool comparison table →</a>
    </p>
    <div class="row" style="margin-top:16px;">
      <button class="btn ghost" onclick="goBack()">← Back</button>
      <button class="btn ghost" onclick="reset()">Start over</button>
    </div>
    <footer>Nothing you enter here is saved, logged, or sent anywhere.</footer>
  `;
}

function renderTaskResult(){
  const tag = profile.tags.find(t=>t.startsWith('task-'));
  const g = TASK_GUIDES[tag];
  let learn = g.learn;
  if(tag==='task-whole-device' && profile.platform){
    const byPlat = {android:'https://securityinabox.org/en/phones-and-computers/android', ios:'https://securityinabox.org/en/phones-and-computers/ios',
      windows:'https://securityinabox.org/en/phones-and-computers/windows', mac:'https://securityinabox.org/en/phones-and-computers/mac', linux:'https://securityinabox.org/en/phones-and-computers/linux'};
    learn = byPlat[profile.platform] || learn;
  }
  renderPriorityGuide(g.title, g.primary, g.alt, g.step, learn);
}

function renderCommsResult(){
  const adv = profile.tags.find(t=>t.startsWith('adv-'));
  const net = profile.tags.find(t=>t.startsWith('net-'));
  const g = commsGuide(adv, net);
  renderPriorityGuide(g.title, g.primary, g.alt, g.step, g.learn);
}

function renderUnsafeResult(){
  const concern = profile.tags.find(t=>t.startsWith('concern-')) || 'concern-general';
  const guide = CONCERN_GUIDES[concern];
  const platformNote = profile.platform==='android'
    ? "Go to findmydevice.google.com (or the Find My Device app) from another device — you can lock it, message it, or erase it remotely if it's still online. Not open-source, but it's the fastest real option right now."
    : profile.platform==='ios'
    ? "Go to icloud.com/find (or Find My on another Apple device) — you can lock or erase it remotely if it's still online."
    : "If the drive wasn't fully encrypted (VeraCrypt/BitLocker/FileVault), assume its contents are now exposed — physical access defeats a login password fairly easily.";
  const app = document.getElementById('app');
  app.innerHTML = `
    <header><h1>🛡️ Digital Security Tool Finder</h1><p class="sub">${guide.title}</p></header>
    <div class="crumbs">${trail.map(t=>t.label).join(' → ')}</div>
    ${guide.warn ? `<div class="caution">${guide.warn}</div>` : ''}
    ${guide.gapNote ? `<div class="caution" style="color:var(--muted);border-color:var(--border);background:var(--chip);">${guide.gapNote}</div>` : ''}
    ${guide.steps.map((s,i)=>`
      <div class="tool">
        <h3>${i+1}. ${s.t}</h3>
        <p>${(s.d||'').replace('__PLATFORM__', platformNote)}</p>
        ${s.link ? `<a href="${s.link.u}" target="_blank" rel="noopener">${s.link.label} →</a>` : ''}
        ${s.tools ? `<div class="tags">${s.tools.map(toolLink).join('')}</div>` : ''}
      </div>`).join('')}
    <p style="font-size:.8rem;color:var(--muted);margin-top:14px;">More background: <a href="${guide.link.u}" target="_blank" rel="noopener" style="color:var(--accent2);">${guide.link.label} →</a></p>
    <div class="row" style="margin-top:16px;">
      <button class="btn ghost" onclick="goBack()">← Back</button>
      <button class="btn ghost" onclick="reset()">Start over</button>
    </div>
    <footer>Nothing you enter here is saved, logged, or sent anywhere.</footer>
  `;
}

// ---------------------------------------------------------------
// STATE + RENDER
// ---------------------------------------------------------------
let node = 'start', profile = {tags:[]}, trail = [];

function choose(nodeId, idx){
  const curNode = NODES[nodeId];
  const opt = curNode.opts[idx];
  trail.push({nodeId, idx, label: opt.label});
  if(opt.tag) profile.tags.push(opt.tag);
  if(curNode.goal) profile.tags.push(curNode.goal);
  if(nodeId==='platform'){
    profile.platform = opt.value;
    if(profile.tags.includes('goal-unsafe')) renderUnsafeResult();
    else if(profile.tags.includes('goal-task')) renderTaskResult();
    else if(profile.tags.includes('goal-comms')) renderCommsResult();
    else renderResults();
    return;
  }
  node = opt.next;
  if(node==='RESULT_ALL'){ renderResults(true); return; }
  if(node==='RESULT_CHECKUP'){ renderCheckup(); return; }
  render();
}

function goBack(){
  if(!trail.length) return;
  const replay = trail.slice(0, -1);
  trail = []; profile = {tags:[]}; node = 'start';
  replay.forEach(step => choose(step.nodeId, step.idx));
  render();
}

function reset(){ node='start'; profile={tags:[]}; trail=[]; render(); }

// Only reached from "just show me everything" now — the curated
// paths above (comms/task/unsafe) each have their own renderer.
function renderResults(){
  const app = document.getElementById('app');
  const list = TOOLS.map(t=>`
      <div class="tool">
        <h3>${t.name}</h3>
        <p>${t.desc}</p>
        <div class="tags">${t.plat.map(p=>`<span class="tag">${p}</span>`).join('')}</div>
        <a href="${t.url}" target="_blank" rel="noopener">${t.url.replace('https://','')} →</a>
      </div>`).join('');

  app.innerHTML = `
    <header>
      <h1>🛡️ Digital Security Tool Finder</h1>
      <p class="sub">Every tool in the database</p>
    </header>
    <div class="crumbs">${trail.map(t=>t.label).join(' → ')}</div>
    ${list}
    <div class="row" style="margin-top:16px;">
      <button class="btn ghost" onclick="goBack()">← Back</button>
      <button class="btn ghost" onclick="reset()">Start over</button>
    </div>
    <footer>Nothing you enter here is saved, logged, or sent anywhere — this runs entirely in your browser tab.</footer>
  `;
}

function render(){
  const n = NODES[node];
  const app = document.getElementById('app');
  app.innerHTML = `
    <header>
      <h1>🛡️ Digital Security Tool Finder</h1>
      <p class="sub">Answer a few questions to narrow down FOSS security tools that actually fit your situation.</p>
      <div class="privacy">Nothing typed here is saved, logged, or transmitted — everything happens locally in this browser tab, and closing it clears it.</div>
    </header>
    <div class="crumbs">${trail.map(t=>t.label).join(' → ')}</div>
    <div class="card">
      <p class="q">${n.text}</p>
      ${n.opts.map((o,i)=>`<button class="opt" onclick="choose('${node}', ${i})">${o.label}${o.sub?`<small>${o.sub}</small>`:''}</button>`).join('')}
    </div>
    ${trail.length ? `<button class="btn ghost" onclick="goBack()">← Back</button>` : ''}
  `;
}

// platform options carry a value field
NODES.platform.opts = NODES.platform.opts.map(([label,value])=>({label,next:null,value}));

render();
</script>
